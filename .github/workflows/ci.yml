name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: one source of truth (the live page's KERNEL block = kernel.mjs; the page carries the committed receipt)
        run: node build.mjs --check
      - name: tests (the fitting rules and the cost case)
        run: npm test
      - name: the committed mutation receipt is for this kernel and these tests
        run: node gate.mjs --verify
  witness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: witness v0.6 mutation gate on the kernel (every mutant), and every export fuzzed
        uses: sjgant80-hub/witness@v0.6
        with:
          files: kernel.mjs
          test-command: node --test kernel.test.mjs
          cap: 100000
          node-version: 20
          fuzz: kernel.mjs:has kernel.mjs:tokenOk kernel.mjs:fitSkin kernel.mjs:effectiveSkin kernel.mjs:resolveVariant kernel.mjs:densityScale kernel.mjs:collectComponents kernel.mjs:orderContent kernel.mjs:findFlow kernel.mjs:appendMessageTo
  witness-skincase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: witness v0.6 mutation gate on the cost case (every mutant)
        uses: sjgant80-hub/witness@v0.6
        with:
          files: skincase.mjs
          test-command: node --test skincase.test.mjs
          cap: 100000
          node-version: 20
          fuzz: skincase.mjs:skinCase skincase.mjs:figures skincase.mjs:sourcesOf
